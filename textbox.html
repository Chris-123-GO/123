<!doctype html>
<html>
  <body>
    <input class="A1" type="search" placeholder="Search" />
    <input class="A2" type="search" placeholder="Search Google or type URL" />
    <p>Email</p>
    <input class="A3" type="email" placeholder="example@gmail.com" />
    <p>By clicking Agree & Join, you agree to the Privacy Policy.</p>
    <button class="A5">Agree & Join</button>
    <img
      class="A6"
      src="CachedImage_1366_768_POS4.jpg"
      alt="A quite cat image."
    />
    <input class="A4" type="text" placeholder="What's happening?" />
    <button class="A7">Tweet</button>
  </body>
  <head>
    <title>Exercise of creating Textbox</title>
    <style>
      p {
        color: rgb(73, 75, 77);
      }

      .A1 {
        height: 35px;
        width: 170px;
        font-size: 20px;
        border-radius: 5px;
        border-style: solid;
        border-color: rgba(128, 128, 128, 0.651);
        margin-right: 50px;
        margin-bottom: 10px;
      }

      .A2 {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 19;
        padding-left: 10px;
        height: 35px;
        width: 500px;
        border: none;
        border-radius: 20px;
        box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.5);
        margin-bottom: 15px;
        margin-right: 500px;
      }
      .A2:hover {
        box-shadow: 1px 1px 10px rgba(0, 0, 0, 0.664);
        cursor: pointer;
      }

      .A3 {
        height: 25px;
        width: 200;
        border-style: solid;
        border-radius: 5px;
      }

      .A4 {
        vertical-align: middle;
        border-color: rgb(26, 58, 240);
      }

      .A5 {
        background-color: blue;
        color: white;
        border: none;
        border-radius: 10px;
        padding-bottom: 10px;
        padding-top: 10px;
        padding-left: 100px;
        padding-right: 100px;
        font-weight: bold;
        margin-right: 332px;
        margin-bottom: 10px;
      }

      .A5:hover {
        opacity: 0.7;
      }

      .A5:active {
        opacity: 0.4;
      }
      .A6 {
        height: 50px;
        width: 50px;
        border-radius: 50px;
        vertical-align: middle;
      }
      .A7 {
        background-color: rgb(29, 155, 240);
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 20px;
        padding-bottom: 8px;
        padding-top: 8px;
        padding-left: 15px;
        padding-right: 15px;
        vertical-align: middle;
      }
      .A7:hover {
        opacity: 0.85;
        cursor: pointer;
      }
      .A7:active {
        opacity: 0.5;
      }
    </style>
  </head>
</html>
